name: "Close inactive issues"

on:
  schedule:
    - cron: "0 0 * * *" # 每天北京时间上午 8 点运行一次
  workflow_dispatch:      # 允许你手动点击按钮运行

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 7      # 7天无回复标记为过时
          days-before-issue-close: 0      # 标记后立即关闭
          stale-issue-message: "此 Issue 已超过 7 天无进展，系统将自动关闭。"
          close-issue-message: "由于长期无回复，此 Issue 已关闭。"
          stale-issue-label: "no-recent-activity"
          # 如果不想处理 PR，取消下面两行的注释
          # days-before-pr-stale: -1
          # days-before-pr-close: -1
